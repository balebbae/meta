<title>Kaiju Avatars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: a one-screen studio. Stage on top, a glass control tray pinned below, dot-grid ground behind everything. */
:root { --bg: #fbf1ea; --bg-dot: #e6cfc4; --fg: #2b2530; --muted: #7a6c78; --card: rgba(255, 255, 255, 0.72); --line: rgba(43, 37, 48, 0.1); --accent: #2d6cdf; --accent-2: #f29a3a; --font: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #2a2630; --bg-dot: #3d3745; --fg: #f4ecf0; --muted: #b7a9b8; --card: rgba(40, 34, 46, 0.72); --line: rgba(255, 255, 255, 0.12); --accent: #6f9cff; --accent-2: #f6b267; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #2a2630; --bg-dot: #3d3745; --fg: #f4ecf0; --muted: #b7a9b8; --card: rgba(40, 34, 46, 0.72); --line: rgba(255, 255, 255, 0.12); --accent: #6f9cff; --accent-2: #f6b267; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg) radial-gradient(circle, var(--bg-dot) 1.2px, transparent 1.6px) 0 0 / 18px 18px; color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
h1 span { color: var(--accent-2); }
header p { margin: 0; color: var(--muted); font-size: 14px; }
#stage { position: relative; flex: 1 1 auto; min-height: 320px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
#stage canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.label { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px; background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 16px; padding: 10px 14px; border-radius: 16px; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.row .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip, .swatch { border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 11px; cursor: pointer; min-height: 32px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.swatch { width: 26px; height: 26px; padding: 0; min-height: 0; border-radius: 50%; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--accent-2); outline-offset: 1px; }
.chip:focus-visible, .swatch:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
@media (max-width: 700px) { h1 { font-size: 18px; } .tray { gap: 6px 10px; padding: 8px 10px; } .chip { padding: 5px 9px; font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { .chip, .swatch { transition: none; } }
</style>
<header>
  <h1>Kaiju <span>Avatars</span></h1>

</header>
