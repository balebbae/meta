<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaiju Avatars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: a one-screen studio. Stage on top, a glass control tray pinned below, dot-grid ground behind everything. */
:root { color-scheme: light; --bg: #fbf1ea; --bg-dot: #e6cfc4; --fg: #2b2530; --muted: #7a6c78; --card: rgba(255, 255, 255, 0.72); --line: rgba(43, 37, 48, 0.1); --accent: #2d6cdf; --accent-2: #f29a3a; --font: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg) radial-gradient(circle, var(--bg-dot) 1.2px, transparent 1.6px) 0 0 / 18px 18px; color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
h1 span { color: var(--accent-2); }
header p { margin: 0; color: var(--muted); font-size: 14px; }
#stage { position: relative; flex: 1 1 auto; min-height: 320px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
#stage canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.label { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px; background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 16px; padding: 10px 14px; border-radius: 16px; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.row .k { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip, .swatch { border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 11px; cursor: pointer; min-height: 32px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.swatch { width: 26px; height: 26px; padding: 0; min-height: 0; border-radius: 50%; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--accent-2); outline-offset: 1px; }
.chip:focus-visible, .swatch:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
@media (max-width: 700px) { h1 { font-size: 18px; } .tray { gap: 6px 10px; padding: 8px 10px; } .chip { padding: 5px 9px; font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { .chip, .swatch { transition: none; } }
.hud { position: absolute; inset: 0; pointer-events: none; }
.pillnav { position: absolute; left: 14px; top: 12px; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: 12px; font-weight: 600; }
.pillnav span { padding: 5px 10px; border-radius: 999px; color: var(--muted); }
.pillnav span.on { background: var(--accent); color: #fff; }
.counter { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 14px; align-items: baseline; padding: 8px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.lives { color: var(--accent-2); font-size: 14px; }
.hudMsg { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.muse { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 10px; align-items: center; max-width: 320px; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); font-size: 13px; line-height: 1.35; }
.orb { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 70% 30%, var(--accent) 0 1.4px, transparent 1.8px) 0 0 / 6px 6px, radial-gradient(circle at 30% 70%, var(--accent-2) 0 1.2px, transparent 1.6px) 3px 3px / 6px 6px, radial-gradient(circle, #fff 55%, transparent 72%); box-shadow: inset 0 0 0 1px var(--line); }
.hud[hidden], .muse[hidden], .boot[hidden] { display: none !important; }
.boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 600; font-size: 14px; }
#char, #move { display: flex; flex-wrap: wrap; }
@media (max-width: 700px) {
  .tray > .row { min-width: 0; }
  #char, #move { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 6px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  #char .chip, #move .chip { flex: 0 0 auto; }
  #stage { min-height: 360px; }
}
@media (pointer: coarse) { .chip { min-height: 40px; padding: 8px 13px; } .swatch { width: 32px; height: 32px; } .padBtn, .bigBtn { min-height: 44px; } }
.counter span { white-space: nowrap; }
@media (max-width: 700px) {
  .pillnav { display: none; }
  .counter { top: 8px; gap: 8px; padding: 5px 10px; font-size: 14px; max-width: calc(100% - 16px); }
  .hudMsg { top: 44px; font-size: 11px; max-width: calc(100% - 16px); }
  .muse { left: 8px; right: 8px; bottom: 8px; max-width: none; padding: 7px 10px; font-size: 12px; line-height: 1.3; }
  .muse .orb { width: 26px; height: 26px; }
}
</style>
<header>
  <h1>Kaiju <span>Avatars</span></h1>
  <p>One pixel family, 16 pixels to the metre: heroes, kaijus, ponies, castles and props. Click a character to poke it.</p>
</header>
<div id="stage"><div id="boot" class="boot" role="status">Loading the kingdom…</div><div id="labels"></div>
  <div id="hud" class="hud" hidden>
    <nav class="pillnav" aria-label="Kaiju sections"><span>Overview</span><span class="on">Games</span><span>Muse</span><span>Avatar</span></nav>
    <div class="counter" role="status" aria-live="polite"><span id="hudL" class="lives"></span><span id="hudC"></span><span id="hudR" class="lives"></span></div>

  </div>

</div>
<div class="tray" aria-label="Character controls">
  <div class="row"><span class="k">Show</span><span id="show" class="row" data-sync="show"></span></div>
  <div class="row"><span class="k">View</span><span id="view" class="row"></span></div>
  <div class="row" style="grid-column: 1 / -1"><span class="k">Character</span><span id="char" class="row" data-sync="char"></span></div>
  <div class="row"><span class="k">Kaiju size</span><span id="variant" class="row" data-sync="variant"></span></div>
  <div class="row"><span class="k">Pony</span><span id="rider" class="row" data-sync="rider"></span></div>
  <div class="row"><span class="k">Skin</span><span id="skin" class="row" data-sync="skin"></span></div>
  <div class="row"><span class="k">Face</span><span id="face" class="row" data-sync="face"></span></div>
  <div class="row" style="grid-column: 1 / -1"><span class="k">Move</span><span id="move" class="row" data-sync="move"></span></div>
</div>
